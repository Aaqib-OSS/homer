[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homer_langgraph"
version = "0.0.1"
description = "Homer durable LangGraph human-in-the-loop runtime"
license = { text = "Apache-2.0" }
readme = "homer_langgraph/README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
homer_langgraph = "homer_langgraph.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["homer_langgraph*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts, dummy token literals as test data, and subprocesses of the interpreter under test.
"**/tests/**" = ["S101", "S105", "S603"]
# Homer's own helpers on PATH: fixed names, argv as a list.
"homer_langgraph/homer_cli.py" = ["S603"]
# A bad argument raises ValueError by contract (ADR-0105), not TypeError.
"homer_langgraph/gates.py" = ["TRY004"]
