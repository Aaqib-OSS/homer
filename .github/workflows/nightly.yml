# Daily: dependency-check and the image scan. Weekly (Sunday): the full mutation runs, every backend
# mutant sharded per package, one job per package to stay under the 6-hour job limit
# (tools/quality/pit-full.mjs), and every console mutant. By hand with workflow_dispatch:
# dependency-check and the image scan, plus each full mutation run whose input is set. The schedules
# skip everything in a private copy of the repository, whose Actions minutes go to per-commit CI.
# Each mutation report writes its score and undetected (survived or uncovered) mutants to the run's
# job summary (tools/quality/step-summary.mjs).
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '41 1 * * 0'
  workflow_dispatch:
    inputs:
      full-backend-mutation:
        description: Also run every backend mutant (hours of runner time)
        type: boolean
        default: false
      full-console-mutation:
        description: Also run every console mutant (hours of runner time)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fails on a CVE at or above the configured CVSS threshold (app/app/build.gradle.kts).
  dependency-check:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '17 2 * * *' && !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The NVD database, built from the dependency-check project's mirror, lives in the Gradle user
      # home; a warm cache only fetches the changed feeds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-v2-${{ github.run_id }}
          restore-keys: dependency-check-nvd-v2-
      - name: Dependency check
        id: check
        run: cd app && ./gradlew :app:dependencyCheckAnalyze :homer-runner:dependencyCheckAnalyze --no-configuration-cache --continue
      # Saved whenever both analyses finished, which their reports prove: the plugin writes each after
      # the update and the scan, before failing on a CVE. actions/cache would save only on success, so
      # every run after a finding would start cold. A run that failed or timed out during the NVD
      # update has no report and may hold a partial database, so it is not saved.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') && hashFiles('app/app/build/reports/dependency-check/dependency-check-report.html') != '' && hashFiles('app/homer-runner/build/reports/dependency-check/dependency-check-report.html') != ''
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check
          path: |
            app/app/build/reports/dependency-check/dependency-check-report.html
            app/homer-runner/build/reports/dependency-check/dependency-check-report.html
          retention-days: 7

  # grype over the images a release publishes, built from the checkout: tool, scope, failure policy
  # and rollout in ADR-0113.
  image-scan:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '17 2 * * *' && !github.event.repository.private)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Report-first until the three images are clean (ADR-0113): a failure warns, and
    # image-scan-alert files it as an issue.
    continue-on-error: true
    outputs:
      # The Scan step's own outcome, which continue-on-error does not mask: a finding or a grype
      # error fails it, and a failed build or install leaves it skipped.
      failed: ${{ steps.scan.outcome != 'success' }}
    env:
      GRYPE_VERSION: 0.121.3
      GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images
        run: |
          docker build -f app/Dockerfile --target runner -t homer-app:scan .
          docker build -f app/Dockerfile --target homer-runner -t homer-runner:scan .
          docker build -f console/Dockerfile --target runner -t homer-console:scan console
      - name: Install grype
        run: |
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
      # Per image: the count per severity, then every High and Critical finding. A scan or a report
      # that cannot be read fails the step, after the other images are scanned.
      - name: Scan
        id: scan
        run: |
          mkdir grype
          "$RUNNER_TEMP/grype" db update
          status=0
          for image in homer-app homer-runner homer-console; do
            report="grype/$image.json"
            "$RUNNER_TEMP/grype" "docker:$image:scan" -o json --file "$report" || { status=1; continue; }
            fixable=$(jq '[(.matches // [])[] | select(.vulnerability.severity == ("Critical", "High") and .vulnerability.fix.state == "fixed")] | length' "$report") || { status=1; continue; }
            [ "$fixable" -eq 0 ] || status=1
            {
              echo "### $image: $fixable High or Critical with a fix"
              echo
              echo '| Severity | Findings | With a fix |'
              echo '| --- | --- | --- |'
              jq -r '["Critical", "High", "Medium", "Low", "Negligible", "Unknown"][] as $s
                | [(.matches // [])[] | select(.vulnerability.severity == $s)]
                | "| \($s) | \(length) | \(map(select(.vulnerability.fix.state == "fixed")) | length) |"' "$report" || status=1
              echo
              echo '| Package | Version | Type | Vulnerability | Severity | Fixed in |'
              echo '| --- | --- | --- | --- | --- | --- |'
              jq -r '(.matches // [])[] | select(.vulnerability.severity == ("Critical", "High"))
                | "| \(.artifact.name) | \(.artifact.version) | \(.artifact.type) | \(.vulnerability.id) | \(.vulnerability.severity) | \((.vulnerability.fix.versions // []) | if length == 0 then "none" else join(", ") end) |"' "$report" || status=1
              echo
            } >>"$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan
          path: grype/
          retention-days: 7

  # continue-on-error leaves a failed image-scan inside a green run, so it opens one tracking issue,
  # or comments on the open one, instead (ADR-0113 amendment).
  image-scan-alert:
    needs: image-scan
    if: ${{ !cancelled() && needs.image-scan.outputs.failed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/quality/image-scan-alert.sh
          sparse-checkout-cone-mode: false
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tools/quality/image-scan-alert.sh

  # The backend shards: one per package directory, the matrix of backend-mutation.
  backend-mutation-shards:
    if: >-
      (github.event.schedule == '41 1 * * 0' && !github.event.repository.private)
      || (github.event_name == 'workflow_dispatch' && inputs.full-backend-mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: shards
        run: |
          shards=$(node tools/quality/pit-full.mjs shards)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  # PIT on one package of :app (ADR-0082): report-only, so a failure warns, and a failed or timed-out
  # shard leaves the merged report partial.
  backend-mutation:
    needs: backend-mutation-shards
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.backend-mutation-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - env:
          SHARD: ${{ matrix.shard }}
        run: node tools/quality/pit-full.mjs run "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-mutation-${{ matrix.shard }}
          path: reports/quality/mutation-backend-shards/${{ matrix.shard }}.xml
          retention-days: 7

  # One report of every shard; partial (no stale exceptions judged) when a shard of the checkout has
  # no report.
  backend-mutation-report:
    needs: [backend-mutation-shards, backend-mutation]
    if: always() && needs.backend-mutation-shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-mutation-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Merge the shards
        run: node tools/quality/pit-full.mjs merge "$RUNNER_TEMP/shards"
      - name: Job summary
        if: always()
        run: node tools/quality/step-summary.mjs app/app/build/reports/pitest mutation-backend 'Backend mutation testing (PIT, all of :app)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-mutation
          path: app/app/build/reports/pitest/
          retention-days: 7

  # Every console mutant: ~7,500 of them, hours of runner time on a cold incremental cache, so
  # weekly (ADR-0082).
  console-mutation-full:
    if: >-
      (github.event.schedule == '41 1 * * 0' && !github.event.repository.private)
      || (github.event_name == 'workflow_dispatch' && inputs.full-console-mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: console/reports/quality/mutation-console/stryker-incremental.json
          key: console-mutation-incremental-v1-${{ github.run_id }}
          restore-keys: console-mutation-incremental-v1-
      - run: |
          cd console
          npm ci
          npm run mutation
      - name: Job summary
        if: always()
        run: node tools/quality/step-summary.mjs console/reports/quality/mutation-console mutation-console 'Console mutation testing (Stryker, full run)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-mutation-full
          path: console/reports/quality/mutation-console/
          retention-days: 7
