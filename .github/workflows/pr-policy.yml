# Fails a pull request that links no accepted issue (tools/pr-policy/check.sh), adds a high or critical
# advisory, or commits a secret (ADR-0090). Exempt: `dependabot[bot]` and `renovate[bot]`, logins only an App can hold.
name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/pr-policy/check-test.sh
      - run: tools/pr-policy/secret-scan-test.sh

  # Free on public repositories only. A known-bad package fails here, before any review reads
  # the pull request.
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # gitleaks over every commit the pull request adds (docs/quality-checks.md); the script, the pinned release
  # and the rules come from the base, never the pull request (ADR-0090).
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      # The merge commit with full history: both the base and the head commit are its ancestors.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f policy/tools/pr-policy/secret-scan.sh ]; then
            echo "::error title=Secret scan::The base branch predates the secret scan; merge main into the base branch, then re-run."
            exit 1
          fi
          gitleaks=$(policy/tools/pr-policy/install-gitleaks.sh "$RUNNER_TEMP/gitleaks")
          cd pr
          ../policy/tools/pr-policy/secret-scan.sh "$gitleaks" "$BASE_SHA" "$HEAD_SHA"

  accepted-issue:
    needs: pr-policy-tests
    # Runs whatever pr-policy-tests concluded: a skipped required check counts as passed, so a
    # pull request that breaks the tests must not skip the gate with them (CWE-285, ADR-0090).
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The base branch's copy of the check, never the pull request's: a pull request must not
      # be able to rewrite the rule it is checked against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Accepted issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
          # The release exemption's facts (tools/pr-policy/check.sh, ADR-0090 amendment), from the
          # event, never from the pull request's files.
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # shellcheck disable=SC2016 # $owner, $name and $pr are GraphQL variables
          gh api graphql -F owner="$OWNER" -F name="$NAME" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 20) {
                    nodes { number repository { nameWithOwner } labels(first: 50) { nodes { name } } }
                  }
                }
              }
            }' >closing-issues.json
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .status + " " + .filename' >pr-files.txt
          PR_FILES=pr-files.txt tools/pr-policy/check.sh "$REPO" <closing-issues.json
