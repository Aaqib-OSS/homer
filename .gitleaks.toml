# gitleaks rules of the pull-request secret scan (job secret-scan; docs/quality-checks.md): the defaults plus one entry
# per file, rule and exact value. Read from the base (ADR-0090), so an entry merges before its fixture.

[extend]
useDefault = true

[[allowlists]]
description = "README.md API reference curl example: placeholder bearer token"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^app/README\.md$''']
regexes = ['''^your-token-here$''']

[[allowlists]]
description = "SERVER.md API reference curl examples: placeholder bearer tokens"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^app/SERVER\.md$''']
regexes = ['''^(your-token|ci-token-value)$''']

[[allowlists]]
description = "SERVER.md Langfuse config example: placeholder secret key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^app/SERVER\.md$''']
regexes = ['''^sk-lf-1234567890abcdef1234567890abcdef$''']

[[allowlists]]
description = "ResultToEnvMapperTest: marker value the test checks never reaches a log line"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^app/app/src/test/kotlin/homer/app/infra/ResultToEnvMapperTest\.kt$''']
regexes = ['''^MARKER-abc123$''']

[[allowlists]]
description = "SecretRedactorTest: fake token the redactor must mask"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^app/app/src/test/kotlin/homer/app/infra/SecretRedactorTest\.kt$''']
regexes = ['''^tok-ABCDEF123456$''']

[[allowlists]]
description = "test_gates.py: fake API key the test checks never reaches a printed line"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^clients/python/homer_langgraph/tests/test_gates\.py$''']
regexes = ['''^s3cr3t-api-key$''']
