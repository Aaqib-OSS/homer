# detekt (ADR-0082 check `detekt`, required); builds on detekt's defaults, so only the differences are listed.

comments:
  active: false
complexity:
  active: false
empty-blocks:
  active: false
# Only MatchingDeclarationName (GH #309); every other default-active rule is listed off.
# tools/quality/detekt.test.mjs pins the active set.
naming:
  active: true
  MatchingDeclarationName:
    active: true
  BooleanPropertyNaming:
    active: false
  ClassNaming:
    active: false
  ConstructorParameterNaming:
    active: false
  EnumNaming:
    active: false
  ForbiddenClassName:
    active: false
  FunctionNameMaxLength:
    active: false
  FunctionNameMinLength:
    active: false
  FunctionNaming:
    active: false
  FunctionParameterNaming:
    active: false
  InvalidPackageDeclaration:
    active: false
  LambdaParameterNaming:
    active: false
  MemberNameEqualsClassName:
    active: false
  NoNameShadowing:
    active: false
  NonBooleanPropertyPrefixedWithIs:
    active: false
  ObjectPropertyNaming:
    active: false
  PackageNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  VariableMaxLength:
    active: false
  VariableMinLength:
    active: false
  VariableNaming:
    active: false
performance:
  active: false
# Only the unused-code rules (GH #297), listed first; every other default-active rule is listed off.
# tools/quality/detekt.test.mjs pins the active set.
style:
  active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedVariable:
    active: true
  AbstractClassCanBeConcreteClass:
    active: false
  AbstractClassCanBeInterface:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  EqualsNullCall:
    active: false
  ExplicitItLambdaMultipleParameters:
    active: false
  ExplicitItLambdaParameter:
    active: false
  ForbiddenComment:
    active: false
  ForbiddenVoid:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  MayBeConstant:
    active: false
  ModifierOrder:
    active: false
  NestedClassesVisibility:
    active: false
  NewLineAtEndOfFile:
    active: false
  ObjectLiteralToLambda:
    active: false
  OptionalAbstractKeyword:
    active: false
  ProtectedMemberInFinalClass:
    active: false
  RedundantHigherOrderMapUsage:
    active: false
  ReturnCount:
    active: false
  SafeCast:
    active: false
  SerialVersionUIDInSerializableClass:
    active: false
  ThrowsCount:
    active: false
  UnnecessaryApply:
    active: false
  UnnecessaryFilter:
    active: false
  UnnecessaryInheritance:
    active: false
  UseAnyOrNoneInsteadOfFind:
    active: false
  UseArrayLiteralsInAnnotations:
    active: false
  UseCheckNotNull:
    active: false
  UseCheckOrError:
    active: false
  UseIsNullOrEmpty:
    active: false
  UseOrEmpty:
    active: false
  UseRequire:
    active: false
  UseRequireNotNull:
    active: false
  UselessCallOnNotNull:
    active: false
  UtilityClassWithPublicConstructor:
    active: false
  VarCouldBeVal:
    active: false
  WildcardImport:
    active: false

coroutines:
  GlobalCoroutineUsage:
    active: true
  # Off: Dispatchers.IO for blocking I/O is the project convention, and no test needs it swapped.
  InjectDispatcher:
    active: false
  SuspendFunInFinallySection:
    active: true
  # Flags cancellation swallowed around suspend calls (runCatching included); use homer.app.infra.coRunCatching.
  SuspendFunSwallowedCancellation:
    active: true

exceptions:
  # Off: most catch-alls are deliberate boundaries (background loops and sweeps that must survive,
  # best-effort telemetry and cleanup, tool and route boundaries mapping to an error result, catches
  # that record and rethrow); SuspendFunSwallowedCancellation covers their one coroutine hazard.
  TooGenericExceptionCaught:
    active: false

potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  ExitOutsideMain:
    active: true
  MissingSuperCall:
    active: true
  # Off: ownership transfers, not leaks; see the ADR-0082 detekt amendment.
  MissingUseCall:
    active: false
  UnconditionalJumpStatementInLoop:
    active: true
