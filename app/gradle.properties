# Build cache: reuses outputs of other successful builds.
org.gradle.caching=true
# Configuration cache: reuses the build configuration; ADR-0056 notes the license tasks that discard it.
org.gradle.configuration-cache=true
# Kotlin daemon heap: a cold full :app:compileTestKotlin (CI, --rerun-tasks) dies at the 512m default; 1g
# passes, 2g adds headroom. The daemon reserves 384m metaspace + 320m code cache on top of the heap.
kotlin.daemon.jvmargs=-Xmx2g
# Repository download retries: the Docker image builds resolve the whole graph on a cold Gradle home in one
# shot, so a dropped connection fails the image build; 5 attempts instead of the default 3 (2 retries).
org.gradle.internal.repository.max.tentatives=5
