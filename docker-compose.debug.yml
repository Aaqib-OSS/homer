# Opt-in JDWP overlay (ADR-0076, CWE-489): binds container loopback and publishes nothing, as a published port
# re-exposes the agent to homer-network. See DOCKER.md.
services:
  backend:
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -DHOMER_LOG_LEVEL=DEBUG -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005
